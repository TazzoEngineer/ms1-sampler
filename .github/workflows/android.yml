# Builds a signed release APK and publishes it as a GitHub Release (which also creates the tag), so it can be
# downloaded straight from the Releases page on the phone. The newest build is always at /releases/latest.
#
# Version: "<pubspec version>-<channel>.<N>" (e.g. 0.1.0-develop.12), versionCode N, tag "<channel>-<version>.<N>"
# (e.g. develop-0.1.0.12). N is the run number of this workflow, so it always increases and Android accepts
# every build as an update of the previous one.
#
# Secrets (see README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Not "CHANNEL": subosito/flutter-action reads that as the Flutter channel.
  RELEASE_CHANNEL: develop
  FLUTTER_VERSION: 3.35.7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          n=${{ github.run_number }}
          echo "name=$base-$RELEASE_CHANNEL.$n" >> "$GITHUB_OUTPUT"
          echo "code=$n" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_CHANNEL-$base.$n" >> "$GITHUB_OUTPUT"
          echo "### $base-$RELEASE_CHANNEL.$n (versionCode $n)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without this, gradle would silently sign with the debug key.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"
          mv build/app/outputs/flutter-apk/app-release.apk "build/ms1_sampler-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ms1_sampler-${{ steps.version.outputs.name }}
          path: build/ms1_sampler-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 7 # The release keeps the APK.

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          apk="build/ms1_sampler-$NAME.apk"
          # A re-run of the same run number replaces the APK of the existing release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --title "$NAME" --generate-notes
          fi
          echo "Released $TAG: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
